# yaml-language-server: $schema=https://raw.githubusercontent.com/Chicago-Offline/ssrf-lite/main/ssrf/_schema/ssrf-lite-0.5.3.schema.json
# SSRF-Lite (SHARED overlay): Chicago Offline community net — GMRS/MURS
#
# Portable community-coordination channels for the Chicago Offline group.
# Not site-bound: no location is set, so downstream generators always include
# these regardless of search location.
#
# Tones:
#   - ChiO GMRS simplex + MURS toned set: DCS 023
#     (changed from DCS 152 on 2026-08-18; the whole toned set is now 023)
#   - ChiO REPEATER: DCS 023 (unchanged -- the repeater's existing on-air
#     configuration already used 023, so it now matches the simplex set)
#
# DCS polarity: normal (N) throughout, stated explicitly via
# dcs_tx_polarity / dcs_rx_polarity (added upstream in ssrf-lite#8,
# resolving ssrf-lite#7). N is also the schema default, so these are
# belt-and-braces -- but stating them means the intent is in the data
# rather than assumed by whoever reads it.
#
# All ids prefixed `chio_` so downstream generators can distinguish shared
# community records from the official library and from personal overlays.
$schema: "https://raw.githubusercontent.com/Chicago-Offline/ssrf-lite/main/ssrf/_schema/ssrf-lite-0.5.3.schema.json"
ssrf_lite_version: "0.5.3"
ssrf_lite:
  sources:
    - name: "Chicago Offline community net (shared)"
      url: "https://chicagooffline.com/"
      accessed: "2026-08-06"

organizations:
  - id: org_chio
    name: "Chicago Offline"

# No location: portable GMRS/MURS channels carried anywhere, not bound to a
# fixed site.
stations:
  - id: stn_chio_gmrs
    organization_id: org_chio
    service: "gmrs"
  - id: stn_chio_murs
    organization_id: org_chio
    service: "murs"
  - id: stn_chio_amateur
    organization_id: org_chio
    service: "amateur"

antennas:
  - id: ant_chio_gmrs
    station_id: stn_chio_gmrs
    name: "ChiOff GMRS handheld/mobile"
  - id: ant_chio_murs
    station_id: stn_chio_murs
    name: "ChiOff MURS handheld"
  - id: ant_chio_amateur
    station_id: stn_chio_amateur
    name: "ChiOff amateur handheld/mobile"

rf_chains:
  # Bandwidth (changed 2026-09-14, was 11K2F3E on the six GMRS chains):
  #   - GMRS 462/467 MHz MAIN channels -> 20K0F3E (wide).
  #     47 CFR 95.1773(a): "The authorized bandwidth is 20 kHz for GMRS
  #     transmitters operating on any of the 462 MHz main channels ... or
  #     any of the 467 MHz main channels." Every ChiO GMRS frequency below
  #     (462.550/.575/.600/.625/.650/.675, 467.550) is a main channel per
  #     95.1763 -- none are interstitial, so none are capped at 12.5 kHz.
  #     This matches the private FAM set, which has been resolving to 25 kHz
  #     all along (though it gets there via an explicit bandwidth_khz: 25
  #     override that contradicts its own 11K2F3E designator -- do it here
  #     with the designator instead, so emission and bandwidth agree).
  #   - MURS 151.820/.880/.940 stay 11K2F3E. Part 95J caps those at
  #     11.25 kHz; they are NOT widenable. MURS 154.570/.600 were already
  #     20K0F3E and are unchanged.
  #
  # chain_chio_repeater went wide with the rest, and that is correct: the
  # machine itself is confirmed set to wide (Eric, 2026-09-14). 20K0F3E here
  # matches it. If the repeater is ever reconfigured to narrow, this chain
  # has to follow it back to 11K2F3E or input deviation will clip.
  #
  # ⚠ FRS is capped at 12.5 kHz on every channel (Part 95B). Anyone on a
  # bubble-pack FRS radio will hear these as over-deviated/distorted, and
  # will sound quiet coming back. Fine for a GMRS-licensed net; revisit if
  # murs_frs_only-tier members are expected on the GMRS channels.
  # ── GMRS simplex (DCS 023) ──────────────────────────────────────────
  # ChiO ALL — GMRS 16 simplex, primary all-hands.
  - id: chain_chio_all
    station_id: stn_chio_gmrs
    antenna_id: ant_chio_gmrs
    rx:
      freq_mhz: 462.575
    tx:
      freq_mhz: 462.575
      emission: "20K0F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"
  # ChiO TEAM 1 — 462.600 simplex.
  - id: chain_chio_team1
    station_id: stn_chio_gmrs
    antenna_id: ant_chio_gmrs
    rx:
      freq_mhz: 462.600
    tx:
      freq_mhz: 462.600
      emission: "20K0F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"
  # ChiO TEAM 2 — 462.625 simplex.
  - id: chain_chio_team2
    station_id: stn_chio_gmrs
    antenna_id: ant_chio_gmrs
    rx:
      freq_mhz: 462.625
    tx:
      freq_mhz: 462.625
      emission: "20K0F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"
  # ChiO TEAM 3 — 462.650 simplex.
  - id: chain_chio_team3
    station_id: stn_chio_gmrs
    antenna_id: ant_chio_gmrs
    rx:
      freq_mhz: 462.650
    tx:
      freq_mhz: 462.650
      emission: "20K0F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"
  # ChiO ROAD — 462.675 simplex. CTCSS 141.3 is the national GMRS
  # travel/road-assistance convention; kept as-is so ChiOff radios remain
  # compatible with the wider convention rather than isolated behind DCS 023.
  - id: chain_chio_road
    station_id: stn_chio_gmrs
    antenna_id: ant_chio_gmrs
    rx:
      freq_mhz: 462.675
    tx:
      freq_mhz: 462.675
      emission: "20K0F3E"
    mode:
      type: "FM"
      ctcss_tx_hz: 141.3
      ctcss_rx_hz: 141.3
  # ChiO REPEATER — GMRS 550 pair: output 462.550, input 467.550 (+5 MHz).
  # Radio-centric: rx = repeater output, tx = repeater input.
  # DCS 023 (existing repeater configuration, unchanged -- the simplex set
  # was moved to 023 to match it rather than the other way around).
  - id: chain_chio_repeater
    station_id: stn_chio_gmrs
    antenna_id: ant_chio_gmrs
    rx:
      freq_mhz: 462.550
    tx:
      freq_mhz: 467.550
      emission: "20K0F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"

  - id: chain_chio_dmr_uhf_call
    station_id: stn_chio_amateur
    antenna_id: ant_chio_amateur
    rx: {freq_mhz: 446.000}
    tx: {freq_mhz: 446.000, emission: "7K60FXE"}
    mode: {type: "DMR", color_code: 1, timeslots: [1]}
  - id: chain_chio_dmr_uhf_446025
    station_id: stn_chio_amateur
    antenna_id: ant_chio_amateur
    rx: {freq_mhz: 446.025}
    tx: {freq_mhz: 446.025, emission: "7K60FXE"}
    mode: {type: "DMR", color_code: 1, timeslots: [1]}
  - id: chain_chio_dmr_uhf_446050
    station_id: stn_chio_amateur
    antenna_id: ant_chio_amateur
    rx: {freq_mhz: 446.050}
    tx: {freq_mhz: 446.050, emission: "7K60FXE"}
    mode: {type: "DMR", color_code: 1, timeslots: [1]}
  - id: chain_chio_dmr_uhf_446075
    station_id: stn_chio_amateur
    antenna_id: ant_chio_amateur
    rx: {freq_mhz: 446.075}
    tx: {freq_mhz: 446.075, emission: "7K60FXE"}
    mode: {type: "DMR", color_code: 1, timeslots: [1]}
  - id: chain_chio_dmr_uhf_446100
    station_id: stn_chio_amateur
    antenna_id: ant_chio_amateur
    rx: {freq_mhz: 446.100}
    tx: {freq_mhz: 446.100, emission: "7K60FXE"}
    mode: {type: "DMR", color_code: 1, timeslots: [1]}

  # ── MURS toned (DCS 023) ────────────────────────────────────────────
  # ChiO MURS 1 — 151.820. Narrow (11K2F3E) per Part 95J.
  - id: chain_chio_murs1
    station_id: stn_chio_murs
    antenna_id: ant_chio_murs
    rx:
      freq_mhz: 151.820
    tx:
      freq_mhz: 151.820
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"
  # ChiO MURS 2 — 151.880.
  - id: chain_chio_murs2
    station_id: stn_chio_murs
    antenna_id: ant_chio_murs
    rx:
      freq_mhz: 151.880
    tx:
      freq_mhz: 151.880
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"
  # ChiO MURS 3 — 151.940.
  - id: chain_chio_murs3
    station_id: stn_chio_murs
    antenna_id: ant_chio_murs
    rx:
      freq_mhz: 151.940
    tx:
      freq_mhz: 151.940
      emission: "11K2F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"
  # ChiO MURS 4 — 154.570 ("blue dot"). Wide (20K0F3E) permitted on the
  # two 154 MHz channels under Part 95J.
  - id: chain_chio_murs4
    station_id: stn_chio_murs
    antenna_id: ant_chio_murs
    rx:
      freq_mhz: 154.570
    tx:
      freq_mhz: 154.570
      emission: "20K0F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"
  # ChiO MURS 5 — 154.600 ("green dot"). Wide permitted.
  - id: chain_chio_murs5
    station_id: stn_chio_murs
    antenna_id: ant_chio_murs
    rx:
      freq_mhz: 154.600
    tx:
      freq_mhz: 154.600
      emission: "20K0F3E"
    mode:
      type: "FM"
      dcs_tx_code: "023"
      dcs_tx_polarity: "N"
      dcs_rx_code: "023"
      dcs_rx_polarity: "N"

assignments:
  # ── GMRS ──
  - id: asg_chio_all
    rf_chain_id: chain_chio_all
    channel_name: "ChiO ALL"
    usage: "simplex"
    service: "gmrs"
  - id: asg_chio_team1
    rf_chain_id: chain_chio_team1
    channel_name: "ChiO TEAM 1"
    usage: "simplex"
    service: "gmrs"
  - id: asg_chio_team2
    rf_chain_id: chain_chio_team2
    channel_name: "ChiO TEAM 2"
    usage: "simplex"
    service: "gmrs"
  - id: asg_chio_team3
    rf_chain_id: chain_chio_team3
    channel_name: "ChiO TEAM 3"
    usage: "simplex"
    service: "gmrs"
  - id: asg_chio_road
    rf_chain_id: chain_chio_road
    channel_name: "ChiO ROAD"
    usage: "simplex"
    service: "gmrs"
  - id: asg_chio_repeater
    rf_chain_id: chain_chio_repeater
    channel_name: "ChiO REPEATER"
    usage: "repeater"
    service: "gmrs"
  - id: asg_chio_dmr_uhf_call
    rf_chain_id: chain_chio_dmr_uhf_call
    channel_name: "DMR UHF Calling"
    usage: "digital-simplex"
    service: "amateur"
  - id: asg_chio_dmr_uhf_446025
    rf_chain_id: chain_chio_dmr_uhf_446025
    channel_name: "DMR UHF 446.025"
    usage: "digital-simplex"
    service: "amateur"
  - id: asg_chio_dmr_uhf_446050
    rf_chain_id: chain_chio_dmr_uhf_446050
    channel_name: "DMR UHF 446.050"
    usage: "digital-simplex"
    service: "amateur"
  - id: asg_chio_dmr_uhf_446075
    rf_chain_id: chain_chio_dmr_uhf_446075
    channel_name: "DMR UHF 446.075"
    usage: "digital-simplex"
    service: "amateur"
  - id: asg_chio_dmr_uhf_446100
    rf_chain_id: chain_chio_dmr_uhf_446100
    channel_name: "DMR UHF 446.100"
    usage: "digital-simplex"
    service: "amateur"
  # ── ChiOff VHF (toned MURS), reversed for wideband priority ──
  # These match the private family VHF frequency order without exposing the
  # private channel names. IDs remain stable for downstream profiles.
  - id: asg_chio_murs5
    rf_chain_id: chain_chio_murs5
    channel_name: "ChiO VHF 1"
    usage: "simplex"
    service: "murs"
    notes: "MURS 5 (154.600, wideband)."
  - id: asg_chio_murs4
    rf_chain_id: chain_chio_murs4
    channel_name: "ChiO VHF 2"
    usage: "simplex"
    service: "murs"
    notes: "MURS 4 (154.570, wideband)."
  - id: asg_chio_murs3
    rf_chain_id: chain_chio_murs3
    channel_name: "ChiO VHF 3"
    usage: "simplex"
    service: "murs"
    notes: "MURS 3 (151.940, narrowband)."
  - id: asg_chio_murs2
    rf_chain_id: chain_chio_murs2
    channel_name: "ChiO VHF 4"
    usage: "simplex"
    service: "murs"
    notes: "MURS 2 (151.880, narrowband)."
  - id: asg_chio_murs1
    rf_chain_id: chain_chio_murs1
    channel_name: "ChiO VHF 5"
    usage: "simplex"
    service: "murs"
    notes: "MURS 1 (151.820, narrowband)."
comments:
  - text: |
      SHARED overlay for the Chicago Offline community net.

      Primary all-hands channel is ChiO ALL (462.575, DCS 023). The toned
      ChiOff set uses DCS 023 throughout, matching the current shared
      community-net configuration.

      ChiO ROAD keeps CTCSS 141.3 for the national GMRS travel/road
      convention. ChiO REPEATER keeps DCS 023 to match its existing on-air
      configuration.

      "ChiO VHF 1-5" carry DCS 023 for group traffic. Profiles that also
      need untoned MURS channels use the canonical assignments from
      SSRF-Lite's U.S. MURS plan rather than duplicating them here.

      DCS polarity is normal (N) on every toned channel, stated
      explicitly rather than left to the schema default. The polarity
      fields were added upstream in Chicago-Offline/ssrf-lite#8.

      Channels are location-less (portable) so they always import
      regardless of search location. All ids prefixed `chio_`.
